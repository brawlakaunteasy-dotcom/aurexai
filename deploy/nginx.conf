# /etc/nginx/sites-available/aurexai.uz
# (certbot --nginx avtomatik 443 portni qo'shadi)

server {
    listen 80;
    listen [::]:80;
    server_name aurexai.uz www.aurexai.uz;

    client_max_body_size 25m;

    location /static/ {
        alias /opt/aurexai/static/;
        access_log off;
        expires 7d;
    }

    # SSE / streaming chat needs disabled buffering
    location /api/chat/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
